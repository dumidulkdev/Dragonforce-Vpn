name: Android APK Build & Release
run-name: Android Release ${{ inputs.release_tag || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag to attach APKs to (e.g. v2.4.1)'
        required: false
        default: 'v2.4.1'

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build, sign, and publish Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install dependencies & run unit tests
        run: |
          npm ci
          npm run build:electron
          npm run typecheck

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/dragonforce-release.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${KEY_ALIAS:-dragonforce}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias dragonforce \
              -storepass dragonforcevpn \
              -keypass dragonforcevpn \
              -dname "CN=DragonForce VPN, OU=Mobile, O=DragonForce, L=Colombo, ST=WP, C=LK"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=dragonforcevpn" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=dragonforce" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=dragonforcevpn" >> "$GITHUB_ENV"
          fi

      - name: Build signed Android APKs (arm64-v8a, x86_64, universal)
        run: npm run build:android

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DragonForce-VPN-Android-APKs
          path: |
            release/DragonForce-VPN-*-android-*.apk
            release/SHA256SUMS-android.txt

      - name: Attach Android APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v2.4.1' }}
        run: |
          if [ -n "$TARGET_TAG" ]; then
            gh release upload "$TARGET_TAG" release/DragonForce-VPN-*-android-*.apk release/SHA256SUMS-android.txt --clobber
          fi
